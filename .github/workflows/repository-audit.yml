name: Repository audit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python eng/audit_repository.py
      - run: python -m unittest discover -s eng -p 'test_*.py'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"
      - run: dotnet run --project eng/SceneVariantSelectionStore.Tests/SceneVariantSelectionStore.Tests.csproj --configuration Release
